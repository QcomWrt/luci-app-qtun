```yaml
name: Build & Release luci-app-qtun

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.4 or v1.0.4-r2)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: qtun-release
  cancel-in-progress: false

jobs:

  # ============================================================
  # PREPARE VERSION
  # ============================================================

  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      final_version: ${{ steps.version.outputs.final_version }}

    steps:

      - name: Determine Version
        id: version
        shell: bash
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          RAW="${TAG#v}"

          echo "======================================"
          echo "Input tag: ${TAG}"
          echo "======================================"

          # Supported:
          #
          # v1.0.4
          # v1.0.4-r2
          # v1.0.4-r3
          #
          # NOT supported:
          # v1.0.4-r1
          #
          if ! echo "$RAW" | grep -Eq \
            '^[0-9]+\.[0-9]+\.[0-9]+$|^[0-9]+\.[0-9]+\.[0-9]+-r[2-9][0-9]*$'
          then
            echo ""
            echo "ERROR: Invalid tag format."
            echo ""
            echo "Supported:"
            echo "  v1.0.4"
            echo "  v1.0.4-r2"
            echo "  v1.0.4-r3"
            echo ""
            echo "Release 1 MUST use:"
            echo "  v1.0.4"
            echo ""
            echo "Received:"
            echo "  ${TAG}"
            exit 1
          fi

          if echo "$RAW" | grep -q -- "-r"; then
            VERSION="${RAW%-r*}"
            RELEASE="${RAW##*-r}"
            FINAL_VERSION="${VERSION}-r${RELEASE}"
          else
            VERSION="$RAW"
            RELEASE="1"
            FINAL_VERSION="$VERSION"
          fi

          echo ""
          echo "======================================"
          echo "Release Information"
          echo "======================================"
          echo "Tag           : ${TAG}"
          echo "PKG_VERSION   : ${VERSION}"
          echo "PKG_RELEASE   : ${RELEASE}"
          echo "FINAL_VERSION : ${FINAL_VERSION}"
          echo "======================================"
          echo ""

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "final_version=${FINAL_VERSION}" >> "$GITHUB_OUTPUT"


  # ============================================================
  # BUILD IPK
  # ============================================================

  build:
    name: Build IPK (${{ matrix.arch }})
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          - arch: x86_64
            target: x86/64

          - arch: aarch64_generic
            target: armsr/armv8

          - arch: aarch64_cortex-a53
            target: sunxi/cortexa53

          - arch: arm_cortex-a7_neon-vfpv4
            target: sunxi/cortexa7

          - arch: arm_cortex-a9
            target: mvebu/cortexa9

    env:
      OWRT_VER: 23.05.0

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        shell: bash
        run: |
          set -e

          sudo apt update

          sudo apt install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            zstd

      - name: Setup SDK
        shell: bash
        run: |
          set -e

          BASE_URL="https://downloads.openwrt.org/releases/${OWRT_VER}/targets/${{ matrix.target }}/"

          echo "Searching SDK:"
          echo "$BASE_URL"

          SDK_FILE="$(
            curl -fsSL "$BASE_URL" |
            grep -oE 'openwrt-sdk-[^"]+Linux-x86_64\.tar\.(xz|zst)' |
            sort -u |
            head -n1
          )"

          if [ -z "$SDK_FILE" ]; then
            echo ""
            echo "ERROR: SDK file not found."
            echo "URL: ${BASE_URL}"
            exit 1
          fi

          SDK_URL="${BASE_URL}${SDK_FILE}"

          echo ""
          echo "SDK:"
          echo "$SDK_URL"
          echo ""

          wget -O sdk.tar "$SDK_URL"

          mkdir sdk

          case "$SDK_FILE" in

            *.tar.xz)
              tar -xf sdk.tar \
                -C sdk \
                --strip-components=1
              ;;

            *.tar.zst)
              tar \
                --use-compress-program=unzstd \
                -xf sdk.tar \
                -C sdk \
                --strip-components=1
              ;;

            *)
              echo "ERROR: Unsupported SDK archive:"
              echo "$SDK_FILE"
              exit 1
              ;;

          esac

          cd sdk

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare Package
        shell: bash
        run: |
          set -e

          mkdir -p workdir

          rsync -av ./ workdir/ \
            --exclude=sdk \
            --exclude=workdir \
            --exclude=.git \
            --exclude=.github

          # Update ONLY the build copy.
          #
          # Repository Makefile is NOT modified here.

          sed -i \
            "s/^PKG_VERSION:=.*/PKG_VERSION:=${{ needs.prepare.outputs.version }}/" \
            workdir/Makefile

          sed -i \
            "s/^PKG_RELEASE:=.*/PKG_RELEASE:=${{ needs.prepare.outputs.release }}/" \
            workdir/Makefile

          echo ""
          echo "======================================"
          echo "Build Makefile"
          echo "======================================"

          grep "^PKG_VERSION" workdir/Makefile
          grep "^PKG_RELEASE" workdir/Makefile

          echo "======================================"
          echo ""

      - name: Build Package
        shell: bash
        run: |
          set -e

          cd sdk

          mkdir -p package/luci-app-qtun

          rsync -av ../workdir/ \
            package/luci-app-qtun/

          make defconfig

          make package/luci-app-qtun/compile V=s

      - name: Collect IPK
        shell: bash
        run: |
          set -e

          mkdir -p release

          FOUND=0

          while IFS= read -r -d '' FILE; do

            FOUND=1

            OUTPUT="luci-app-qtun_${{ needs.prepare.outputs.final_version }}_${{ matrix.arch }}.ipk"

            echo "Source:"
            echo "$FILE"

            echo ""
            echo "Output:"
            echo "release/${OUTPUT}"

            cp "$FILE" "release/${OUTPUT}"

          done < <(
            find sdk/bin/packages/ \
              -type f \
              -name "luci-app-qtun*.ipk" \
              -print0
          )

          if [ "$FOUND" -eq 0 ]; then
            echo ""
            echo "ERROR: No IPK package found!"
            exit 1
          fi

          echo ""
          echo "Generated IPK:"
          ls -lh release/*.ipk

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qtun-ipk-${{ matrix.arch }}
          path: release/*.ipk
          if-no-files-found: error


  # ============================================================
  # BUILD APK
  # ============================================================

  build-apk:
    name: Build APK (${{ matrix.arch }})
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          - arch: x86_64
            target: x86/64

          - arch: aarch64_generic
            target: armsr/armv8

          - arch: aarch64_cortex-a53
            target: sunxi/cortexa53

          - arch: arm_cortex-a7_neon-vfpv4
            target: sunxi/cortexa7

          - arch: arm_cortex-a9
            target: mvebu/cortexa9

    env:
      OWRT_VER: 25.12.0

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        shell: bash
        run: |
          set -e

          sudo apt update

          sudo apt install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            zstd

      - name: Setup SDK
        shell: bash
        run: |
          set -e

          BASE_URL="https://downloads.openwrt.org/releases/${OWRT_VER}/targets/${{ matrix.target }}/"

          echo "Searching SDK:"
          echo "$BASE_URL"

          SDK_FILE="$(
            curl -fsSL "$BASE_URL" |
            grep -oE 'openwrt-sdk-[^"]+Linux-x86_64\.tar\.(xz|zst)' |
            sort -u |
            head -n1
          )"

          if [ -z "$SDK_FILE" ]; then
            echo ""
            echo "ERROR: SDK file not found."
            echo "URL: ${BASE_URL}"
            exit 1
          fi

          SDK_URL="${BASE_URL}${SDK_FILE}"

          echo ""
          echo "SDK:"
          echo "$SDK_URL"
          echo ""

          wget -O sdk.tar "$SDK_URL"

          mkdir sdk

          case "$SDK_FILE" in

            *.tar.xz)
              tar -xf sdk.tar \
                -C sdk \
                --strip-components=1
              ;;

            *.tar.zst)
              tar \
                --use-compress-program=unzstd \
                -xf sdk.tar \
                -C sdk \
                --strip-components=1
              ;;

            *)
              echo "ERROR: Unsupported SDK archive:"
              echo "$SDK_FILE"
              exit 1
              ;;

          esac

          cd sdk

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare Package
        shell: bash
        run: |
          set -e

          mkdir -p workdir

          rsync -av ./ workdir/ \
            --exclude=sdk \
            --exclude=workdir \
            --exclude=.git \
            --exclude=.github

          # Update ONLY the build copy.
          #
          # Repository Makefile is NOT modified here.

          sed -i \
            "s/^PKG_VERSION:=.*/PKG_VERSION:=${{ needs.prepare.outputs.version }}/" \
            workdir/Makefile

          sed -i \
            "s/^PKG_RELEASE:=.*/PKG_RELEASE:=${{ needs.prepare.outputs.release }}/" \
            workdir/Makefile

          echo ""
          echo "======================================"
          echo "Build Makefile"
          echo "======================================"

          grep "^PKG_VERSION" workdir/Makefile
          grep "^PKG_RELEASE" workdir/Makefile

          echo "======================================"
          echo ""

      - name: Build Package
        shell: bash
        run: |
          set -e

          cd sdk

          mkdir -p package/luci-app-qtun

          rsync -av ../workdir/ \
            package/luci-app-qtun/

          make defconfig

          make package/luci-app-qtun/compile V=s

      - name: Collect APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          FOUND=0

          while IFS= read -r -d '' FILE; do

            FOUND=1

            OUTPUT="luci-app-qtun_${{ needs.prepare.outputs.final_version }}_${{ matrix.arch }}.apk"

            echo "Source:"
            echo "$FILE"

            echo ""
            echo "Output:"
            echo "release/${OUTPUT}"

            cp "$FILE" "release/${OUTPUT}"

          done < <(
            find sdk/bin/packages/ \
              -type f \
              -name "luci-app-qtun*.apk" \
              -print0
          )

          if [ "$FOUND" -eq 0 ]; then
            echo ""
            echo "ERROR: No APK package found!"
            exit 1
          fi

          echo ""
          echo "Generated APK:"
          ls -lh release/*.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qtun-apk-${{ matrix.arch }}
          path: release/*.apk
          if-no-files-found: error


  # ============================================================
  # CREATE GITHUB RELEASE
  # ============================================================

  release:
    name: Create GitHub Release
    needs:
      - prepare
      - build
      - build-apk

    runs-on: ubuntu-latest

    steps:

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-artifacts
          merge-multiple: true

      - name: Show Release Files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Release Information"
          echo "======================================"

          echo "Tag:"
          echo "${{ needs.prepare.outputs.tag }}"

          echo ""
          echo "Version:"
          echo "${{ needs.prepare.outputs.final_version }}"

          echo ""
          echo "Files:"

          find ./all-artifacts \
            -maxdepth 1 \
            -type f \
            -print

          echo "======================================"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            ./all-artifacts/*.ipk
            ./all-artifacts/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # UPDATE MAKEFILE ON MASTER
  # ============================================================

  update-makefile:
    name: Update Makefile on master
    needs:
      - prepare
      - release

    runs-on: ubuntu-latest

    steps:

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Makefile
        shell: bash
        run: |
          set -e

          VERSION="${{ needs.prepare.outputs.version }}"
          RELEASE="${{ needs.prepare.outputs.release }}"

          echo ""
          echo "======================================"
          echo "Updating repository Makefile"
          echo "======================================"

          echo "Version : ${VERSION}"
          echo "Release : ${RELEASE}"

          sed -i \
            "s/^PKG_VERSION:=.*/PKG_VERSION:=${VERSION}/" \
            Makefile

          sed -i \
            "s/^PKG_RELEASE:=.*/PKG_RELEASE:=${RELEASE}/" \
            Makefile

          echo ""
          echo "Updated Makefile:"
          grep "^PKG_VERSION" Makefile
          grep "^PKG_RELEASE" Makefile

          echo "======================================"

      - name: Commit and Push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Makefile

          if git diff --cached --quiet; then
            echo ""
            echo "No Makefile changes detected."
            echo "Nothing to commit."
            exit 0
          fi

          VERSION="${{ needs.prepare.outputs.version }}"
          RELEASE="${{ needs.prepare.outputs.release }}"

          git commit \
            -m "chore: update QTUN to ${VERSION}-r${RELEASE}"

          echo ""
          echo "Pushing Makefile update to master..."

          git push origin HEAD:master

          echo ""
          echo "======================================"
          echo "Makefile successfully updated."
          echo "======================================"

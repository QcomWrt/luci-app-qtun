```yaml
name: Build & Release luci-app-qtun

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.4 or v1.0.4-r2)"
        required: true
        default: "v1.0.4"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86/64
          - arch: aarch64_generic
            target: armsr/armv8
          - arch: aarch64_cortex-a53
            target: sunxi/cortexa53
          - arch: arm_cortex-a7_neon-vfpv4
            target: sunxi/cortexa7
          - arch: arm_cortex-a9
            target: mvebu/cortexa9

    env:
      OWRT_VER: 23.05.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse Tag
        run: |
          set -e

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="${{ github.event.inputs.tag }}"
          fi

          echo "RESOLVED_TAG=$TAG_NAME" >> "$GITHUB_ENV"

          RAW="${TAG_NAME#v}"

          if echo "$RAW" | grep -q -- "-r"; then
            VERSION="${RAW%-r*}"
            RELEASE="${RAW##*-r}"
          else
            VERSION="$RAW"
            RELEASE="1"
          fi

          if [ "$RELEASE" = "1" ]; then
            FINAL_VERSION="$VERSION"
          else
            FINAL_VERSION="${VERSION}-r${RELEASE}"
          fi

          echo "QTUN_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "QTUN_RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "QTUN_FINAL_VERSION=$FINAL_VERSION" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Tag          : $TAG_NAME"
          echo "PKG_VERSION  : $VERSION"
          echo "PKG_RELEASE  : $RELEASE"
          echo "FINAL_VERSION: $FINAL_VERSION"
          echo "======================================"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison gawk gettext git \
            libncurses5-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget curl zstd

      - name: Setup SDK
        run: |
          set -e

          BASE_URL="https://downloads.openwrt.org/releases/${OWRT_VER}/targets/${{ matrix.target }}/"

          SDK_FILE="$(curl -fsSL "$BASE_URL" | \
            grep -oE 'openwrt-sdk-[^"]+Linux-x86_64\.tar\.(xz|zst)' | \
            sort -u | head -n1)"

          if [ -z "$SDK_FILE" ]; then
            echo "SDK file not found in $BASE_URL"
            exit 1
          fi

          SDK_URL="${BASE_URL}${SDK_FILE}"

          echo "Downloading SDK:"
          echo "$SDK_URL"

          wget -O sdk.tar "$SDK_URL"

          mkdir sdk

          case "$SDK_FILE" in
            *.tar.xz)
              tar -xf sdk.tar -C sdk --strip-components=1
              ;;
            *.tar.zst)
              tar --use-compress-program=unzstd \
                -xf sdk.tar \
                -C sdk \
                --strip-components=1
              ;;
            *)
              echo "Unsupported SDK archive: $SDK_FILE"
              exit 1
              ;;
          esac

          cd sdk

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Dynamic Version into Makefile
        run: |
          set -e

          mkdir -p workdir

          rsync -av ./ workdir/ \
            --exclude=sdk \
            --exclude=workdir \
            --exclude=.git \
            --exclude=.github

          sed -i \
            "s/^PKG_VERSION:=.*/PKG_VERSION:=${QTUN_VERSION}/" \
            workdir/Makefile

          sed -i \
            "s/^PKG_RELEASE:=.*/PKG_RELEASE:=${QTUN_RELEASE}/" \
            workdir/Makefile

          echo "==== Patched Makefile ===="
          grep "^PKG_VERSION" workdir/Makefile
          grep "^PKG_RELEASE" workdir/Makefile

      - name: Build Package
        run: |
          set -e

          cd sdk

          mkdir -p package/luci-app-qtun

          rsync -av ../workdir/ package/luci-app-qtun/

          make defconfig
          make package/luci-app-qtun/compile V=s

      - name: Collect Artifacts
        run: |
          set -e

          mkdir -p release

          FOUND=0

          find sdk/bin/packages/ \
            -type f \
            -name "luci-app-qtun*.ipk" \
            -print0 |
          while IFS= read -r -d '' f; do
            FOUND=1

            NEW_NAME="luci-app-qtun_${QTUN_FINAL_VERSION}_${{ matrix.arch }}.ipk"

            echo "Copy:"
            echo "$f"
            echo "To:"
            echo "release/$NEW_NAME"

            cp "$f" "release/$NEW_NAME"
          done

          if ! compgen -G "release/*.ipk" > /dev/null; then
            echo "ERROR: No IPK package found!"
            exit 1
          fi

          ls -lh release/*.ipk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qtun-${{ matrix.arch }}
          path: release/*.ipk
          if-no-files-found: error


  build-apk:
    name: Build APK (${{ matrix.arch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86/64
          - arch: aarch64_generic
            target: armsr/armv8
          - arch: aarch64_cortex-a53
            target: sunxi/cortexa53
          - arch: arm_cortex-a7_neon-vfpv4
            target: sunxi/cortexa7
          - arch: arm_cortex-a9
            target: mvebu/cortexa9

    env:
      OWRT_VER: 25.12.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse Tag
        run: |
          set -e

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="${{ github.event.inputs.tag }}"
          fi

          echo "RESOLVED_TAG=$TAG_NAME" >> "$GITHUB_ENV"

          RAW="${TAG_NAME#v}"

          if echo "$RAW" | grep -q -- "-r"; then
            VERSION="${RAW%-r*}"
            RELEASE="${RAW##*-r}"
          else
            VERSION="$RAW"
            RELEASE="1"
          fi

          if [ "$RELEASE" = "1" ]; then
            FINAL_VERSION="$VERSION"
          else
            FINAL_VERSION="${VERSION}-r${RELEASE}"
          fi

          echo "QTUN_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "QTUN_RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "QTUN_FINAL_VERSION=$FINAL_VERSION" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Tag          : $TAG_NAME"
          echo "PKG_VERSION  : $VERSION"
          echo "PKG_RELEASE  : $RELEASE"
          echo "FINAL_VERSION: $FINAL_VERSION"
          echo "======================================"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison gawk gettext git \
            libncurses5-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget curl zstd

      - name: Setup SDK
        run: |
          set -e

          BASE_URL="https://downloads.openwrt.org/releases/${OWRT_VER}/targets/${{ matrix.target }}/"

          SDK_FILE="$(curl -fsSL "$BASE_URL" | \
            grep -oE 'openwrt-sdk-[^"]+Linux-x86_64\.tar\.(xz|zst)' | \
            sort -u | head -n1)"

          if [ -z "$SDK_FILE" ]; then
            echo "SDK file not found in $BASE_URL"
            exit 1
          fi

          SDK_URL="${BASE_URL}${SDK_FILE}"

          echo "Downloading SDK:"
          echo "$SDK_URL"

          wget -O sdk.tar "$SDK_URL"

          mkdir sdk

          case "$SDK_FILE" in
            *.tar.xz)
              tar -xf sdk.tar -C sdk --strip-components=1
              ;;
            *.tar.zst)
              tar --use-compress-program=unzstd \
                -xf sdk.tar \
                -C sdk \
                --strip-components=1
              ;;
            *)
              echo "Unsupported SDK archive: $SDK_FILE"
              exit 1
              ;;
          esac

          cd sdk

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Dynamic Version into Makefile
        run: |
          set -e

          mkdir -p workdir

          rsync -av ./ workdir/ \
            --exclude=sdk \
            --exclude=workdir \
            --exclude=.git \
            --exclude=.github

          sed -i \
            "s/^PKG_VERSION:=.*/PKG_VERSION:=${QTUN_VERSION}/" \
            workdir/Makefile

          sed -i \
            "s/^PKG_RELEASE:=.*/PKG_RELEASE:=${QTUN_RELEASE}/" \
            workdir/Makefile

          echo "==== Patched Makefile ===="
          grep "^PKG_VERSION" workdir/Makefile
          grep "^PKG_RELEASE" workdir/Makefile

      - name: Build Package
        run: |
          set -e

          cd sdk

          mkdir -p package/luci-app-qtun

          rsync -av ../workdir/ package/luci-app-qtun/

          make defconfig
          make package/luci-app-qtun/compile V=s

      - name: Collect APK Artifacts
        run: |
          set -e

          mkdir -p release

          find sdk/bin/packages/ \
            -type f \
            -name "luci-app-qtun*.apk" \
            -print0 |
          while IFS= read -r -d '' f; do
            NEW_NAME="luci-app-qtun_${QTUN_FINAL_VERSION}_${{ matrix.arch }}.apk"

            echo "Copy:"
            echo "$f"
            echo "To:"
            echo "release/$NEW_NAME"

            cp "$f" "release/$NEW_NAME"
          done

          if ! compgen -G "release/*.apk" > /dev/null; then
            echo "ERROR: No APK package found!"
            exit 1
          fi

          ls -lh release/*.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qtun-apk-${{ matrix.arch }}
          path: release/*.apk
          if-no-files-found: error


  release:
    name: Create GitHub Release
    needs:
      - build
      - build-apk

    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-artifacts
          merge-multiple: true

      - name: Determine Tag Name
        run: |
          set -e

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="${{ github.event.inputs.tag }}"
          fi

          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          generate_release_notes: true
          files: |
            ./all-artifacts/*.ipk
            ./all-artifacts/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # UPDATE MAKEFILE AND PUSH TO MASTER
  # ============================================================

  bump-makefile:
    name: Update Makefile Version
    needs:
      - release
    runs-on: ubuntu-latest

    steps:

      # IMPORTANT:
      # Always checkout MASTER.
      # This prevents the Makefile update from being committed
      # to the tag itself.

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Version
        shell: bash
        run: |
          set -e

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="${{ github.event.inputs.tag }}"
          fi

          RAW="${TAG_NAME#v}"

          if echo "$RAW" | grep -q -- "-r"; then
            VERSION="${RAW%-r*}"
            RELEASE="${RAW##*-r}"
          else
            VERSION="$RAW"
            RELEASE="1"
          fi

          echo "QTUN_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "QTUN_RELEASE=$RELEASE" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Updating Makefile"
          echo "======================================"
          echo "Tag     : $TAG_NAME"
          echo "Version : $VERSION"
          echo "Release : $RELEASE"
          echo "======================================"

      - name: Update Makefile
        shell: bash
        run: |
          set -e

          sed -i \
            "s/^PKG_VERSION:=.*/PKG_VERSION:=${QTUN_VERSION}/" \
            Makefile

          sed -i \
            "s/^PKG_RELEASE:=.*/PKG_RELEASE:=${QTUN_RELEASE}/" \
            Makefile

          echo ""
          echo "==== Updated Makefile ===="

          grep "^PKG_VERSION" Makefile
          grep "^PKG_RELEASE" Makefile

      - name: Commit Makefile
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Makefile

          if git diff --cached --quiet; then
            echo "No version change detected."
            exit 0
          fi

          git commit \
            -m "chore: bump QTUN to ${QTUN_VERSION}-r${QTUN_RELEASE}"

      - name: Push to protected master
        shell: bash
        run: |
          set -e

          echo "Pushing Makefile update to master..."

          git push origin HEAD:master

          echo ""
          echo "======================================"
          echo "SUCCESS"
          echo "Makefile pushed to master."
          echo "======================================"

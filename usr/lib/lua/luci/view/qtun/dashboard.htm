<%+header%>

<div class="cbi-map">
    <h2>QTUN Dashboard</h2>

    <div class="grid">

        <div class="card">
            <h3>Status Jaringan</h3>
            <p>IP: <span id="pub-ip">Loading...</span></p>
            <p>ISP: <span id="isp-name">-</span></p>
        </div>

        <div class="card">
            <h3>Core Status</h3>
            <p>
                Service:
                <span id="core-status" class="status-badge">Checking...</span>
            </p>
            <p>
                Mode:
                <span id="mode-active">-</span>
            </p>
        </div>

        <div class="card">
            <h3>Control</h3>

            <label>Mode:</label>
            <select id="mode" onchange="toggleBackendOption(); saveSettings();" style="width:100%; margin-top:5px;">
                <option value="zivpn">ZiVPN</option>
                <option value="q-ssh">Q SSH</option>
                <option value="clash">Clash</option>
            </select>

            <!-- KHUSUS Q-SSH INJECT MODE -->
            <div id="qssh-inject-field" style="margin-top:10px; display:none;">
                <label>Q-SSH Inject Mode:</label>
                <select id="qssh-inject-mode" onchange="saveSettings()" style="width:100%; margin-top:5px;">
                    <option value="direct">Direct</option>
                    <option value="direct_payload">Payload</option>
                    <option value="ssh_proxy">Proxy</option>
                    <option value="ssh_proxy_payload">Proxy + Payload</option>
                    <option value="ssl_sni">SSL / SNI</option>
                    <option value="ssl_payload">SSL + Payload (WebSocket)</option>
                </select>
            </div>

            <div id="backend-option-field" style="margin-top:10px; display:none;">
                <label>Backend Engine:</label>
                <select id="backend" onchange="saveSettings()" style="width:100%; margin-top:5px;">
                    <option value="clash">Clash / Mihomo Core</option>
                    <option value="tun">Sing-Box TUN Core</option>
                </select>
            </div>

            <div style="margin-top:12px;">
                <label>
                    <input type="checkbox" id="autostart" onchange="saveSettings()">
                    Auto Start
                </label>
            </div>

            <div style="margin-top:15px;">
                <button class="cbi-button cbi-button-apply" onclick="startTunnel()">Start</button>
                <button class="cbi-button cbi-button-reset" onclick="stopTunnel()">Stop</button>
            </div>
        </div>

        <div id="clash-profile-card" class="card" style="display:none;">
            <h3>Clash Profile</h3>
            <p>
                Active:
                <b><span id="clash-profile-active">-</span></b>
            </p>
            <label>Config:</label>
            <select id="clash-profile-select" style="width:100%; margin-top:5px;"></select>
            <div style="margin-top:15px;">
                <button class="cbi-button cbi-button-apply" onclick="setClashProfile()">
                    Set Config
                </button>
            </div>
            <p id="clash-profile-status" style="margin-top:10px;font-weight:bold;"></p>
        </div>
    </div>

    <div id="clash-dashboard-card" class="card" style="margin-top:10px; display:none;">
        <h3>Clash Dashboard</h3>
        <p>Akses Web UI Clash:</p>
        <div class="clash-btn-group">
            <button class="clash-btn yacd-btn" onclick="openYacd()">Open YACD</button>
            <button class="clash-btn metacubexd-btn" onclick="openMetacubexd()">Open metacubexd</button>
        </div>
    </div>
</div>

<style>
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 15px;
}

.card {
    border: 1px solid #ccc;
    padding: 15px;
    border-radius: 8px;
}

.status-badge {
    padding: 4px 8px;
    border-radius: 5px;
    font-weight: bold;
}

.running {
    background: #4CAF50;
    color: white;
}

.stopped {
    background: #f44336;
    color: white;
}

.clash-btn-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.clash-btn {
    flex: 1;
    min-width: 140px;
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    text-align: center;
    transition: all 0.25s ease;
}

.clash-btn:hover {
    transform: translateY(-2px);
    opacity: 0.9;
}

.yacd-btn {
    background: #2196F3;
    color: white;
}

.metacubexd-btn {
    background: #9C27B0;
    color: white;
}
</style>

<script type="text/javascript">

let cachedIP = null;
let cachedInfo = null;

const IP = {
    get: () => {
        return XHR.get('/cgi-bin/luci/qtun/ipinfo', null, function() {})
            .then(response => {
                let data = response.json ? response.json() : response;
                return data;
            });
    },

    updateUI: (data) => {
        if (!data || data.status !== "success") {
            throw new Error("Invalid IP data");
        }

        document.getElementById('pub-ip').innerHTML = data.query || "-";
        document.getElementById('isp-name').innerHTML =
            `${data.country || "-"}, ${data.isp || "-"} (${data.as || "-"})`;

        document.getElementById('isp-name').style.color = '#ff3333';
    },

    getIPInfo: () => {
        if (cachedIP && cachedInfo) {
            IP.updateUI(cachedInfo);
            return;
        }

        XHR.get('/cgi-bin/luci/qtun/ipinfo', null, function(x, data) {
            if (data && data.status === "success") {
                cachedIP = data.query;
                cachedInfo = data;
                IP.updateUI(data);
            } else {
                document.getElementById('pub-ip').innerHTML = "Gagal mengambil IP";
                document.getElementById('isp-name').innerHTML = "Silahkan Cek koneksi internet anda";
            }
        });
    }
};

/* TOGGLE VISIBILITAS FORM CONTROL */
function toggleBackendOption() {
    let mode = document.getElementById("mode").value;
    let backendField = document.getElementById("backend-option-field");
    let qsshInjectField = document.getElementById("qssh-inject-field");
    
    // TAMPILKAN field Inject Mode HANYA jika mode utama adalah q-ssh
    if (mode === "q-ssh") {
        qsshInjectField.style.display = "block";
    } else {
        qsshInjectField.style.display = "none";
    }

    // SEMBUNYIKAN dropdown backend jika mode adalah zivpn, clash, atau q-ssh
    if (mode === "zivpn" || mode === "clash" || mode === "q-ssh") {
        backendField.style.display = "none";
    } else {
        backendField.style.display = "block";
    }
}

/* SAVE MODE + ENABLED + BACKEND + QSSH INJECT MODE */
function saveSettings() {
    let modeSelect = document.getElementById("mode");

    /* BLOCK jika service sedang running */
    if (modeSelect.disabled) {
        return;
    }

    let mode = modeSelect.value;
    let enabled = document.getElementById("autostart").checked ? "1" : "0";
    let backend = document.getElementById("backend").value;
    let qsshInjectMode = document.getElementById("qssh-inject-mode").value;

    XHR.post('<%=luci.dispatcher.build_url("admin/services/qtun/set_config")%>', {
        mode: mode,
        enabled: enabled,
        backend: backend,
        qssh_inject_mode: qsshInjectMode
    }, function(x) {});
}

function setClashProfile() {
    let profile = document.getElementById("clash-profile-select").value;
    let status = document.getElementById("clash-profile-status");

    if (!profile) {
        status.style.color = "red";
        status.innerHTML = "Config belum dipilih";
        return;
    }

    status.style.color = "green";
    status.innerHTML = "Applying config...";

    XHR.post('<%=luci.dispatcher.build_url("admin/services/qtun/set_config")%>', {
        clash_profile: profile
    }, function(x, data) {
        restartTunnel();
        status.innerHTML = "Config applied: " + profile;
    });
}

let coreActionState = "idle"; 

function startTunnel() {
    coreActionState = "starting";

    let statusEl = document.getElementById("core-status");
    statusEl.innerHTML = "Starting...";
    statusEl.className = "status-badge";

    XHR.get('<%=luci.dispatcher.build_url("admin/services/qtun/start")%>', null, function() {
        cachedIP = null;
        setTimeout(fetchData, 1500);
    });
}

function stopTunnel() {
    coreActionState = "stopping";

    let statusEl = document.getElementById("core-status");
    statusEl.innerHTML = "Stopping...";
    statusEl.className = "status-badge";

    XHR.get('<%=luci.dispatcher.build_url("admin/services/qtun/stop")%>', null, function() {
        cachedIP = null;
        setTimeout(fetchData, 1000);
    });
}

function restartTunnel() {
    coreActionState = "starting";

    let statusEl = document.getElementById("core-status");
    statusEl.innerHTML = "Restarting...";
    statusEl.className = "status-badge";

    XHR.get('<%=luci.dispatcher.build_url("admin/services/qtun/restart")%>', null, function() {
        cachedIP = null;
        setTimeout(fetchData, 2000);
    });
}

function openYacd() {
    window.open('http://' + window.location.hostname + ':9090/ui/yacd', '_blank');
}

function openMetacubexd() {
    window.open('http://' + window.location.hostname + ':9090/ui/metacubexd', '_blank');
}

/* STATUS FETCH POLLING */
function fetchData() {
    XHR.get('<%=luci.dispatcher.build_url("admin/services/qtun/status")%>', null,
        function(x, data) {
            if (!data) return;

            /* MODE + AUTOSTART */
            document.getElementById("mode-active").innerHTML = data.mode || "-";
            if (data.mode) {
                document.getElementById("mode").value = data.mode;
                toggleBackendOption(); // Sinkronkan status display dropdown
            }

            /* SYNC Q-SSH INJECT MODE */
            if (data.qssh_inject_mode) {
                document.getElementById("qssh-inject-mode").value = data.qssh_inject_mode;
            }

            let enabled = (data.enabled == "1");
            document.getElementById("autostart").checked = enabled;

            if (data.backend) {
                document.getElementById("backend").value = data.backend;
            }

            let statusEl = document.getElementById("core-status");

            /* =========================
               STATUS ENGINE
            ========================= */
            if (coreActionState === "starting") {
                if (data.running) {
                    statusEl.innerHTML = "Running";
                    statusEl.className = "status-badge running";
                    coreActionState = "idle";

                    if (!cachedIP) IP.getIPInfo();
                } else {
                    statusEl.innerHTML = "Starting...";
                    statusEl.className = "status-badge";
                }

            } else if (coreActionState === "stopping") {
                if (!data.running) {
                    statusEl.innerHTML = "Stopped";
                    statusEl.className = "status-badge stopped";
                    coreActionState = "idle";
                } else {
                    statusEl.innerHTML = "Stopping...";
                    statusEl.className = "status-badge";
                }

            } else {
                /* Normal status */
                if (data.running) {
                    statusEl.innerHTML = "Running";
                    statusEl.className = "status-badge running";

                    if (!cachedIP) IP.getIPInfo();
                } else {
                    statusEl.innerHTML = "Stopped";
                    statusEl.className = "status-badge stopped";
                }
            }

            /* =========================
               CLASH DASHBOARD CARD
            ========================= */
            let clashCard = document.getElementById("clash-dashboard-card");
            clashCard.style.display = data.clash_running ? "block" : "none";

            let modeSelect = document.getElementById("mode");
            let qsshInjectSelect = document.getElementById("qssh-inject-mode");

            if (data.running || coreActionState === "starting" || coreActionState === "stopping") {
                /* LOCK MODE & QSSH INJECT SELECTOR */
                modeSelect.disabled = true;
                modeSelect.style.opacity = "0.7";
                modeSelect.style.cursor = "not-allowed";

                qsshInjectSelect.disabled = true;
                qsshInjectSelect.style.opacity = "0.7";
                qsshInjectSelect.style.cursor = "not-allowed";
            } else {
                /* UNLOCK MODE & QSSH INJECT SELECTOR */
                modeSelect.disabled = false;
                modeSelect.style.opacity = "1";
                modeSelect.style.cursor = "pointer";

                qsshInjectSelect.disabled = false;
                qsshInjectSelect.style.opacity = "1";
                qsshInjectSelect.style.cursor = "pointer";
            }

            /* =========================
               CLASH PROFILE CARD
            ========================= */
            let clashProfileCard = document.getElementById("clash-profile-card");
            let clashProfileSelect = document.getElementById("clash-profile-select");
            let clashProfileActive = document.getElementById("clash-profile-active");

            if (data.mode === "clash") {
                clashProfileCard.style.display = "block";
                clashProfileActive.innerHTML = data.clash_profile || "-";
                clashProfileSelect.innerHTML = "";

                if (data.clash_profiles && data.clash_profiles.length > 0) {
                    data.clash_profiles.forEach(function(p) {
                        let opt = document.createElement("option");
                        opt.value = p;
                        opt.text = p;

                        if (p === data.clash_profile) {
                            opt.selected = true;
                        }

                        clashProfileSelect.appendChild(opt);
                    });
                } else {
                    let opt = document.createElement("option");
                    opt.value = "";
                    opt.text = "Belum ada config";
                    clashProfileSelect.appendChild(opt);
                }
            } else {
                clashProfileCard.style.display = "none";
            }
        }
    );
}

/* AUTO REFRESH */
setInterval(fetchData, 3000);

/* INITIAL */
document.addEventListener('DOMContentLoaded', (event) => {
    fetchData();
    IP.getIPInfo();
});
</script>

<%+footer%>
